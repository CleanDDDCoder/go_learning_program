name: Curriculum Integrity CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-curriculum:
    name: Validate Curriculum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check gofmt formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Formatting issues found:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Validate metadata
        run: |
          if [ ! -f "curriculum.yaml" ]; then
            echo "curriculum.yaml not found"
            exit 1
          fi
          lesson_paths=$(awk '/path: lessons\// { print $3 }' curriculum.yaml)
          if [ -z "$lesson_paths" ]; then
            echo "curriculum.yaml does not list lessons"
            exit 1
          fi
          for dir in $lesson_paths; do
            for file in lesson.go lesson_test.go lesson.yaml hints.yaml; do
              if [ ! -f "$dir/$file" ]; then
                echo "Missing $file in $dir"
                exit 1
              fi
            done
            if grep -Eq '^(id|track):' "$dir/lesson.yaml"; then
              echo "lesson.yaml must not redeclare id or track in $dir"
              exit 1
            fi
            for key in package title unsolved_state concepts difficulty; do
              if ! grep -Eq "^$key:" "$dir/lesson.yaml"; then
                echo "Missing $key in $dir/lesson.yaml"
                exit 1
              fi
            done
          done

      - name: Validate solution overlays
        run: |
          lesson_paths=$(awk '/path: lessons\// { print $3 }' curriculum.yaml)
          for dir in $lesson_paths; do
            rel=${dir#lessons/}
            solution_dir="solutions/$rel"
            if [ ! -f "$solution_dir/lesson.go" ]; then
              echo "Missing solution for $dir"
              exit 1
            fi
            count=$(find "$solution_dir" -maxdepth 1 -name "*.go" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Solution directory must contain exactly one .go file: $solution_dir"
              exit 1
            fi
            if [ "$(head -n 1 "$solution_dir/lesson.go")" != "//go:build ignore" ]; then
              echo "Solution must start with //go:build ignore: $solution_dir/lesson.go"
              exit 1
            fi
          done

      - name: Run tests
        run: go test ./...

      - name: Validate solved state
        run: |
          tmp=$(mktemp -d)
          cp -R . "$tmp/project"
          cd "$tmp/project"
          lesson_paths=$(awk '/path: lessons\// { print $3 }' curriculum.yaml)
          for dir in $lesson_paths; do
            rel=${dir#lessons/}
            tail -n +3 "solutions/$rel/lesson.go" > "$dir/lesson.go"
          done
          go test ./...
